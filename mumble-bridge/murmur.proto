syntax = "proto3";

package murmur;

service V1 {
    // Authenticator Service
    rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
    
    // Server Control (The Handshake)
    rpc AuthenticatorRegister(AuthenticatorRegisterRequest) returns (AuthenticatorRegisterResponse);
}

message AuthenticateRequest {
    string name = 1;
    string pw = 2;
}

message AuthenticateResponse {
    int32 status = 1;
    int32 id = 2;
    string name = 3;
    repeated string groups = 4;
}

message AuthenticatorRegisterRequest {
    string address = 1; 
}

message AuthenticatorRegisterResponse {
}
